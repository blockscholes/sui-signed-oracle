# Real Sui deployment record, hand-maintained — the shared objects and signer info a
# real `sui client publish` does NOT record anywhere on its own.
#
# Package-level facts (package id, chain-id, upgrade cap, toolchain/build config) are
# already tracked automatically by Sui itself in each package's own Published.toml
# (move/bs_oracle/Published.toml, move/example_consumer/Published.toml — auto-generated
# by a real publish, and meant to be committed; see the header comment in those files).
# This file only covers what that mechanism has no schema for: the shared objects
# (SignerRegistry, AdminCap, ExampleOracle) created in the same publish transaction, and
# the signer key set on the registry afterward.
#
# Update this file by hand whenever a real deployment or signer rotation changes.

