# Real Sui deployment record, hand-maintained.
#
# This is NOT the Sui CLI's `--pubfile-path` output: `sui client publish` refuses that
# flag outright ("should not be used with the `publish` subcommand — use `test-publish`
# instead"), so the CLI's own publish-record file only ever exists for ephemeral
# test-publishes (see `**/Published.toml` / `**/Pub.*.toml` in .gitignore). Object ids
# below (registry/oracle/admin cap) also aren't part of that file's schema even when it
# does apply — the CLI only ever tracks package ids.
#
# Update this file by hand whenever a real deployment changes.

